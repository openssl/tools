[project]
name = "openssl-tools"
version = "1.0.0"
description = "Shared Python for the OpenSSL maintainer tools"
requires-python = ">=3.10"
# No runtime dependencies, by design: these run on release build hosts and
# on provisioned review hosts, where installing packages is not always
# possible.  pytest is a development-only dependency.
dependencies = []

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: tests that talk to api.openssl.org (deselected by default)",
]
addopts = "-m 'not network'"
