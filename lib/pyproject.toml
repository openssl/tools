[project]
name = "openssl-tools"
version = "1.0.0"
description = "Shared Python for the OpenSSL maintainer tools"
requires-python = ">=3.10"
# No runtime dependencies, by design: these run on release build hosts and
# on provisioned review hosts, where installing packages is not always
# possible.  pytest is a development-only dependency.
dependencies = []

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: tests that talk to api.openssl.org (deselected by default)",
]
addopts = "-m 'not network'"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pinned explicitly rather than relying on the default set, which varies
# between ruff releases.
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # import sorting
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "C4",    # comprehensions
    "PIE",
    "PERF",
    "RUF",
    "DTZ",   # naive datetimes
    "S",     # bandit
    "BLE",   # blind except
    "FURB",
]
ignore = [
    # Release dates are naive calendar dates in the local zone, matching the
    # `date '+%-d %b %Y'` the shell used.  Making them timezone-aware would
    # change what gets written into CHANGES.md.
    "DTZ011",
]

[tool.ruff.lint.isort]
known-first-party = ["openssl_tools", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the point
    "S603",    # subprocess calls with a literal argv
    "S607",    # git, make and gzip are found on PATH deliberately
]

[tool.mypy]
python_version = "3.10"
files = ["openssl_tools", "tests"]
# The package is fully annotated; keep it that way.
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
# Test functions are untyped by convention -- annotating several hundred of
# them would be noise.  Their bodies are still checked against the package's
# types, which is where the value is: a test double that stops matching the
# interface it stands in for gets caught here.
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
