[project]
name = "stagerelease"
version = "1.0.0"
description = "OpenSSL release staging"
requires-python = ">=3.10"
# No runtime dependencies, by design: this runs on release build hosts where
# installing packages is not always possible.  pytest is a development-only
# dependency, see [dependency-groups] below.
dependencies = []

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests that shell out to git repeatedly",
]
